<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
  <aside class="sidebar"><h2>SpendWise</h2></aside>
  <main>
    <header class="header"><h1>Budget Dashboard</h1><button>Add Expense</button></header>
    <div class="cards-grid">
      <div class="card" tabindex="0"><span class="card-title">Food</span><span class="card-amount">$420.50</span></div>
      <div class="card" tabindex="0"><span class="card-title">Transport</span><span class="card-amount">$180.00</span></div>
      <div class="card" tabindex="0"><span class="card-title">Rent</span><span class="card-amount">$1,200.00</span></div>
      <div class="card" tabindex="0"><span class="card-title">Entertainment</span><span class="card-amount">$95.30</span></div>
      <div class="card" tabindex="0"><span class="card-title">Savings</span><span class="card-amount">$800.00</span></div>
      <div class="card" tabindex="0"><span class="card-title">Utilities</span><span class="card-amount">$150.75</span></div>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
